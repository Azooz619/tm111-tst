<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TM111 — بنك أسئلة المراجعة</title>
<style>
:root{--bg:#0b1b30;--panel:#142b45;--panel2:#10243b;--line:#294561;--text:#f4f7fb;--muted:#a9bdd2;--accent:#63dfc2;--accent2:#45cdb0}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#183653 0,#0b1b30 55%);color:var(--text);font-family:Tahoma,Arial,sans-serif;min-height:100vh}
header{max-width:1080px;margin:auto;padding:20px 22px;display:flex;align-items:center;justify-content:space-between}
.logo{width:44px;height:44px;border-radius:14px;background:var(--accent);color:#073025;display:grid;place-items:center;font-weight:900}
.headtitle{flex:1;margin-right:14px}.headtitle b{font-size:18px}.headtitle small{display:block;color:var(--muted);margin-top:5px}
.badge{border:1px solid var(--line);border-radius:30px;padding:10px 16px;color:#d6e2ee}
main{max-width:1080px;margin:10px auto 40px;padding:0 22px}
.card{background:linear-gradient(145deg,#19334f,#12283f);border:1px solid #2a4863;border-radius:24px;overflow:hidden;box-shadow:0 18px 60px #0005}
.hero{padding:35px 38px;border-bottom:1px solid var(--line)}
.kicker{color:var(--accent);font-weight:bold}.hero h1{font-size:34px;margin:12px 0}.hero p{color:var(--muted);font-size:17px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:24px}
.setting{background:var(--panel2);border:1px solid var(--line);border-radius:15px;padding:16px}
.setting label{display:block;color:var(--muted);margin-bottom:8px}
select,input[type=number]{width:100%;background:#0c2036;color:white;border:1px solid #35536e;border-radius:10px;padding:11px;font-size:15px}
.start{margin-top:16px;width:100%;background:#164d50;color:var(--accent);border:1px solid #4ccdb3;border-radius:13px;padding:15px;font-size:17px;font-weight:bold;cursor:pointer}
.quiz{display:none;padding:30px 38px}.top{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:12px}
.progress{height:8px;background:#0c2036;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:.25s}
.q{font-size:22px;line-height:1.7;margin:28px 0 20px;font-weight:bold}
.option{display:block;background:#10263e;border:1px solid #2e4a65;border-radius:13px;padding:14px 16px;margin:10px 0;cursor:pointer;transition:.15s}
.option:hover{border-color:var(--accent);background:#15324c}.option input{margin-left:10px}
.code{direction:ltr;text-align:left;background:#091a2c;border:1px solid #294561;border-radius:12px;padding:14px;margin:12px 0;white-space:pre-wrap;font-family:Consolas,monospace;color:#d8f7ee}
.actions{display:flex;gap:10px;margin-top:25px}.actions button,.result button{padding:13px 20px;border-radius:11px;border:1px solid #385570;cursor:pointer;font-size:15px}
.next{background:#194d50;color:var(--accent);border-color:#4ccdb3!important}.prev{background:#10263e;color:#dce8f2}.finish{background:#0f7b67;color:#fff}
.result{display:none;padding:35px 38px}.score{text-align:center;font-size:46px;font-weight:900;color:var(--accent);margin:20px}.result h2{text-align:center}
.review{margin-top:28px}.reviewItem{border:1px solid #385570;border-radius:13px;padding:14px;margin:10px 0}.bad{background:#3a2028}.good{background:#16382f}.restart{display:block;margin:25px auto;background:#164d50;color:var(--accent)}
@media(max-width:700px){header{padding:15px}.badge{display:none}.hero,.quiz,.result{padding:25px 20px}.settings{grid-template-columns:1fr}.q{font-size:19px}}

.sectionGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:25px}
.sectionCard{background:#10263e;border:1px solid #2d4b66;border-radius:15px;padding:20px;text-align:right;color:#fff;cursor:pointer;min-height:125px;transition:.2s}
.sectionCard:hover{border-color:#63dfc2;background:#15324c;transform:translateY(-2px)}
.sectionCard strong{display:block;color:#63dfc2;font-size:18px;margin-bottom:9px}
.sectionCard span{display:block;color:#e9f0f7;line-height:1.6}
.sectionCard small{display:block;color:#91a9c0;margin-top:10px}
.sectionCard.all{border-color:#4ccdb3;background:#164d50}
.selectedTitle{margin-top:22px;color:#63dfc2;font-size:18px;font-weight:bold}
@media(max-width:700px){.sectionGrid{grid-template-columns:1fr}}

.noRepeatNote{margin-top:14px;padding:12px 14px;background:#10263e;border:1px solid #2d4b66;border-radius:11px;color:#b9ccdd;font-size:14px}
.resetBank{margin-top:10px;background:transparent;color:#a9bdd2;border:1px solid #385570;border-radius:10px;padding:9px 13px;cursor:pointer}
.resetBank:hover{color:#fff;border-color:#63dfc2}

.option.correctOption{border-color:#36d399!important;background:#123d35!important;color:#d7fff2}
.option.wrongOption{border-color:#fb7185!important;background:#45222b!important;color:#ffe4e8}
.feedback{margin-top:16px;padding:14px 16px;border-radius:12px;font-weight:bold;line-height:1.7}
.feedback.correctFeedback{background:#123d35;border:1px solid #36d399;color:#d7fff2}
.feedback.wrongFeedback{background:#45222b;border:1px solid #fb7185;color:#ffe4e8}
.feedback small{display:block;font-weight:normal;color:#e8d7db;margin-top:5px}
</style>
</head>
<body>
<header>
  <div class="logo">AOU</div>
  <div class="headtitle"><b>اختبارات تفاعلية — TM111</b><small>بنك أسئلة شامل للمراجعة</small></div>
  <div class="badge">100+ سؤال</div>
</header>

<main>
<div class="card">
<section class="hero" id="home">
  <div class="kicker">أسئلة المراجعة</div>
  <h1>اختر الاجتماع</h1>
  <p>كل Meeting له قسم مستقل. اختر القسم للمراجعة، أو اختر الاختبار الشامل لجميع الاجتماعات.</p>

  <div class="sectionGrid">
    <button class="sectionCard" onclick="selectSection('M1')">
      <strong>Meeting 1</strong>
      <span>Algorithms, Flowcharts & Pseudocode</span>
      <small>25 سؤال</small>
    </button>
    <button class="sectionCard" onclick="selectSection('M2')">
      <strong>Meeting 2</strong>
      <span>Fundamentals of Python Programming</span>
      <small>32 سؤال</small>
    </button>
    <button class="sectionCard" onclick="selectSection('M3')">
      <strong>Meeting 3</strong>
      <span>Decision Structures & Boolean Logic</span>
      <small>24 سؤال</small>
    </button>
    <button class="sectionCard" onclick="selectSection('M4')">
      <strong>Meeting 4</strong>
      <span>Repetition Structures & Loops</span>
      <small>21 سؤال</small>
    </button>
    <button class="sectionCard" onclick="selectSection('M5')">
      <strong>Meeting 5</strong>
      <span>Collection Data Types</span>
      <small>30 سؤال</small>
    </button>
    <button class="sectionCard all" onclick="selectSection('ALL')">
      <strong>اختبار شامل</strong>
      <span>جميع الاجتماعات + أسئلة الأكواد والمخرجات</span>
      <small>بنك الأسئلة كامل</small>
    </button>
  </div>

  <div id="settingsBox" style="display:none">
    <div class="selectedTitle" id="selectedTitle"></div>
    <div class="settings">
      <div class="setting"><label>عدد الأسئلة</label><select id="count"><option>10</option><option>20</option><option>30</option><option>40</option><option>50</option><option>75</option><option selected>100</option></select></div>
      <div class="setting"><label>نوع الأسئلة</label><select id="mode"><option value="all">كل الأسئلة</option><option value="mcq">اختيار من متعدد</option><option value="code">أسئلة الأكواد والمخرجات</option></select></div>
    </div>
    <div class="noRepeatNote">🔒 لن تتكرر الأسئلة التي حللتها سابقًا في نفس القسم حتى تنتهي من بنك الأسئلة.</div>
    <button type="button" class="resetBank" onclick="resetHistory()">مسح سجل الأسئلة السابقة</button>
    <button class="start" onclick="startQuiz()">ابدأ الاختبار</button>
  </div>
</section>

<section class="quiz" id="quiz">
  <div class="top"><span id="num"></span><span id="cat"></span></div>
  <div class="progress"><i id="bar"></i></div>
  <div id="question"></div>
  <div class="actions"><button class="prev" onclick="prevQ()">السابق</button><button class="next" onclick="nextQ()">التالي</button></div>
</section>

<section class="result" id="result">
  <h1>انتهى الاختبار 🎉</h1>
  <div class="score" id="score"></div>
  <h2 id="msg"></h2>
  <div class="review" id="review"></div>
  <button class="restart" onclick="location.reload()">اختبار جديد</button>
</section>
</div>
</main>

<script>
const Q=[

["M1","أي خاصية تعني أن خطوات الخوارزمية واضحة ولا تحمل أكثر من معنى؟",["Input","Unambiguous","Output","Finiteness"],1],

let pool=[],current=0,answers=[],picked=[],selectedSection='ALL';
function shuffle(a){return a.sort(()=>Math.random()-0.5)}
function historyKey(){return 'tm111_used_' + selectedSection;}
function getUsed(){try{return JSON.parse(localStorage.getItem(historyKey())||'[]')}catch(e){return []}}
function saveUsed(ids){localStorage.setItem(historyKey(),JSON.stringify(ids))}
function resetHistory(){
  if(confirm('هل تريد مسح سجل الأسئلة التي حللتها والبدء من جديد؟')){
    if(selectedSection==='ALL'){
      ['M1','M2','M3','M4','M5','ALL'].forEach(k=>localStorage.removeItem('tm111_used_'+k));
    }else localStorage.removeItem(historyKey());
    alert('تم مسح سجل الأسئلة.');
  }
}
function selectSection(section){
 selectedSection=section;
 const names={M1:'Meeting 1 — Algorithms, Flowcharts & Pseudocode',M2:'Meeting 2 — Fundamentals of Python Programming',M3:'Meeting 3 — Decision Structures & Boolean Logic',M4:'Meeting 4 — Repetition Structures & Loops',M5:'Meeting 5 — Collection Data Types',ALL:'اختبار شامل — جميع الاجتماعات'};
 document.getElementById('selectedTitle').textContent='القسم المختار: '+names[section];
 document.getElementById('settingsBox').style.display='block';
 document.getElementById('settingsBox').scrollIntoView({behavior:'smooth',block:'center'});
}
function startQuiz(){
 const n=+document.getElementById('count').value, mode=document.getElementById('mode').value;
 let p=Q.filter(x=>
   (selectedSection==='ALL'||x[0]===selectedSection) &&
   (mode==='all'||(mode==='code'&&x[0]==='CODE')||(mode==='mcq'&&x[0]!=='CODE'))
 );
 if(selectedSection!=='ALL' && mode==='code') p=[];
 if(!p.length){alert('لا توجد أسئلة من النوع المختار في هذا القسم.');return}

 // Use the array index as a stable question ID. Previously completed questions are excluded.
 const allIds=p.map(x=>Q.indexOf(x));
 const used=getUsed().filter(id=>allIds.includes(id));
 const available=p.filter(x=>!used.includes(Q.indexOf(x)));
 let chosen;
 if(available.length>=n){
   chosen=shuffle([...available]).slice(0,n);
 }else{
   // If fewer than requested remain, give all remaining instead of repeating.
   chosen=shuffle([...available]);
 }
 if(!chosen.length){
   alert('خلصت كل أسئلة هذا القسم بدون تكرار 🎉\nاضغط "مسح سجل الأسئلة السابقة" إذا تبي تعيد البنك من البداية.');
   return;
 }
 pool=chosen;
 answers=Array(pool.length).fill(null);current=0;
 document.getElementById('home').style.display='none';
 document.getElementById('quiz').style.display='block';render();
}
function render(){
 const x=pool[current], title=x[0]==='CODE'?'أسئلة الأكواد والمخرجات':x[0]==='M1'?'Meeting 1 — Algorithms':x[0]==='M2'?'Meeting 2 — Python':x[0]==='M3'?'Meeting 3 — Decisions':x[0]==='M4'?'Meeting 4 — Repetition':'Meeting 5 — Collections';
 document.getElementById('num').textContent=`السؤال ${current+1} من ${pool.length}`;
 document.getElementById('cat').textContent=title;
 document.getElementById('bar').style.width=((current+1)/pool.length*100)+'%';
 let text=x[1], parts=text.split('\n'), html=`<div class="q">${parts[0]}`;
 if(parts.length>1) html+=`<div class="code">${parts.slice(1).join('\n')}</div>`;
 html+=`</div>`;
 x[2].forEach((o,i)=>{
   let cls='';
   if(answers[current]!==null){
     if(i===x[3]) cls=' correctOption';
     else if(i===answers[current]) cls=' wrongOption';
   }
   html+=`<label class="option${cls}"><input type="radio" name="ans" value="${i}" ${answers[current]===i?'checked':''} ${answers[current]!==null?'disabled':''}>${o}</label>`;
 });
 if(answers[current]!==null){
   const correct=answers[current]===x[3];
   html+=`<div class="feedback ${correct?'correctFeedback':'wrongFeedback'}">${correct?'✓ إجابة صحيحة!':'✗ إجابة غير صحيحة.'} ${correct?'':'<small>الإجابة الصحيحة: '+x[2][x[3]]+'</small>'}</div>`;
 }
 document.getElementById('question').innerHTML=html;
 document.querySelectorAll('input[name="ans"]').forEach(el=>el.addEventListener('change',()=>{
   answers[current]=+el.value;
   render();
 }));
 document.querySelector('.prev').style.visibility=current?'visible':'hidden';
 document.querySelector('.next').textContent=current===pool.length-1?'إنهاء الاختبار':'التالي';
}
function save(){let e=document.querySelector('input[name="ans"]:checked');if(e)answers[current]=+e.value}
function nextQ(){save();if(current<pool.length-1){current++;render()}else finish()}
function prevQ(){save();if(current){current--;render()}}
function finish(){
 save();let score=0,review='';
 pool.forEach((x,i)=>{
  let ok=answers[i]===x[3];if(ok)score++;
  review+=`<div class="reviewItem ${ok?'good':'bad'}"><b>السؤال ${i+1}</b> — ${ok?'✓ صحيح':'✗ خطأ'}<br>${ok?'':'الإجابة الصحيحة: '+x[2][x[3]]}</div>`;
 });
 // Mark these questions as used only after the whole quiz is completed.
 const oldUsed=getUsed();
 const newIds=pool.map(x=>Q.indexOf(x));
 saveUsed([...new Set([...oldUsed,...newIds])]);

 document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';
 let pct=Math.round(score/pool.length*100);
 document.getElementById('score').textContent=`${score} / ${pool.length} — ${pct}%`;
 document.getElementById('msg').textContent=pct===100?'ممتاز! كل الإجابات صحيحة 🔥':pct>=85?'ممتاز جدًا، مستواك قوي 💪':pct>=70?'جيد جدًا، راجع الأخطاء البسيطة 📚':'راجع المحاضرات وحاول مرة ثانية 💡';
 const remaining=Q.filter(x=>(selectedSection==='ALL'||x[0]===selectedSection)&&!getUsed().includes(Q.indexOf(x))).length;
 document.getElementById('review').innerHTML=`<div class="noRepeatNote">🔒 بقي لك تقريبًا ${remaining} سؤال غير محلول في هذا القسم قبل أن يبدأ التكرار.</div>`+review;
 window.scrollTo({top:0,behavior:'smooth'});
}
</script>
</body>
