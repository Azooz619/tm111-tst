<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبارات تفاعلية - 200 سؤال MTA (TM111)</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b131f;
            --card-bg: #132235;
            --accent-green: #36b37e;
            --accent-green-hover: #2d9669;
            --text-main: #ffffff;
            --text-muted: #8c9ba5;
            --border-color: #1e324a;
            --correct-bg: #0e382b;
            --correct-border: #13734e;
            --incorrect-bg: #3d141d;
            --incorrect-border: #a12b42;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 950px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background-color: #65d6ad;
            color: #0b131f;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .header-text h2 {
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .header-text p {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 8px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            transition: 0.2s;
        }

        .tab-btn:hover {
            border-color: var(--accent-green);
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--accent-green);
            color: #0b131f;
            font-weight: bold;
            border-color: var(--accent-green);
        }

        .quiz-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
        }

        .progress-container {
            width: 100%;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--accent-green);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 25px;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-item {
            background-color: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
            direction: ltr;
            text-align: left;
            font-size: 1rem;
        }

        .option-item:hover {
            border-color: var(--accent-green);
            background-color: rgba(54, 179, 126, 0.05);
        }

        .radio-icon {
            width: 20px;
            height: 20px;
            border: 2px solid var(--text-muted);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .option-item.selected .radio-icon {
            border-color: var(--accent-green);
        }

        .option-item.selected .radio-icon::after {
            content: '';
            width: 10px;
            height: 10px;
            background-color: var(--accent-green);
            border-radius: 50%;
        }

        .feedback-box {
            display: none;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.6;
            direction: ltr;
            text-align: left;
        }

        .feedback-box.correct {
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-border);
            color: #72f2b8;
        }

        .feedback-box.incorrect {
            background-color: var(--incorrect-bg);
            border: 1px solid var(--incorrect-border);
            color: #ff99aa;
        }

        .feedback-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .feedback-ref {
            margin-top: 10px;
            font-size: 0.85rem;
            opacity: 0.8;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 8px;
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-action {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .btn-action:hover:not(:disabled) {
            background-color: rgba(255, 255, 255, 0.1);
        }

        .btn-action:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-finish {
            border-color: #a12b42;
            color: #ff99aa;
        }

        .btn-next {
            background-color: var(--accent-green);
            color: #0b131f;
            font-weight: bold;
            border: none;
        }

        .btn-next:hover {
            background-color: var(--accent-green-hover);
        }

        .footer-nav {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            outline: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <div class="logo-badge">AOU</div>
            <div class="header-text">
                <h2>اختبارات تفاعلية (الجامعة العربية المفتوحة)</h2>
                <p>بنك أسئلة الشامل الكلي - 200 سؤال كاملة (TM111)</p>
            </div>
        </div>
    </div>

    <!-- Section Navigation Tabs -->
    <div class="tabs-container">
        <button class="tab-btn active" id="tab-all" onclick="switchSection('all')">الشامل الكلي (200 سؤال)</button>
        <button class="tab-btn" id="tab-m1" onclick="switchSection('m1')">Meeting 1 (40 سؤالاً)</button>
        <button class="tab-btn" id="tab-m2" onclick="switchSection('m2')">Meeting 2 (40 سؤالاً)</button>
        <button class="tab-btn" id="tab-m3" onclick="switchSection('m3')">Meeting 3 (40 سؤالاً)</button>

        <button class="tab-btn" id="tab-m5" onclick="switchSection('m5')">Meeting 5 (40 سؤالاً)</button>
    </div>

    <!-- Quiz Main Card -->
    <div class="quiz-card">
        <div class="quiz-meta">
            <span id="question-count">السؤال 1</span>
            <span style="color: var(--accent-green);" id="section-badge">يمكنك تغيير اختيارك في أي وقت</span>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="question-text" id="question-text"></div>

        <div class="options-list" id="options-container"></div>

        <div class="feedback-box" id="feedback-box">
            <div class="feedback-title" id="feedback-title">Correct!</div>
            <div id="feedback-why">Why: ...</div>
            <div class="feedback-ref" id="feedback-ref">Reference: ...</div>
        </div>

        <div class="card-actions">
            <button class="btn-action btn-finish" onclick="resetSection()">إعادة هذا النموذج ↻</button>
            <div style="display: flex; gap: 10px;">
                <button class="btn-action" id="prev-btn" onclick="prevQuestion()" disabled>السابق</button>
                <button class="btn-action btn-next" id="next-btn" onclick="nextQuestion()">التالي</button>
            </div>
        </div>
    </div>

    <div class="footer-nav">
        <div>
            <span>انتقال سريع إلى: </span>
            <select id="jump-select" onchange="jumpToQuestion(this.value)"></select>
        </div>
        <div id="answered-counter">تمت الإجابة على 0 سؤالاً</div>
    </div>
</div>

    function processBank() {
        const bank = { m1: [], m2: [], m3: [], m4: [], m5: [] };
        ['m1', 'm2', 'm3', 'm4', 'm5'].forEach(key => {
            rawData[key].forEach(item => {
                bank[key].push({
                    q: item[0],
                    options: item[1],
                    correct: item[2],
                    why: item[3],
                    ref: item[4]
                });
            });
        });
        return bank;
    }

    const allQuestions = processBank();
    let activeSection = 'all';
    let currentQuestions = [];
    let currentIndex = 0;
    let userAnswers = [];

    function switchSection(secKey) {
        activeSection = secKey;

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        const activeTab = document.getElementById(`tab-${secKey}`);
        if (activeTab) activeTab.classList.add('active');

        if (secKey === 'all') {
            currentQuestions = [
                ...allQuestions.m1,
                ...allQuestions.m2,
                ...allQuestions.m3,
                ...allQuestions.m4,
                ...allQuestions.m5
            ];
            document.getElementById('section-badge').textContent = 'النموذج الشامل الكلي (200 سؤال)';
        } else {
            currentQuestions = allQuestions[secKey];
            document.getElementById('section-badge').textContent = `قسم ${secKey.toUpperCase()} (40 سؤالاً)`;
        }

        userAnswers = new Array(currentQuestions.length).fill(null);
        currentIndex = 0;

        populateJumpSelect();
        loadQuestion(0);
    }

    function populateJumpSelect() {
        const select = document.getElementById('jump-select');
        select.innerHTML = '';
        currentQuestions.forEach((_, idx) => {
            const opt = document.createElement('option');
            opt.value = idx;
            opt.textContent = `السؤال ${idx + 1}`;
            select.appendChild(opt);
        });
    }

    function loadQuestion(index) {
        currentIndex = index;
        const q = currentQuestions[index];

        document.getElementById('question-count').textContent = `السؤال ${index + 1} من ${currentQuestions.length}`;
        document.getElementById('progress-bar').style.width = `${((index + 1) / currentQuestions.length) * 100}%`;
        document.getElementById('jump-select').value = index;

        document.getElementById('question-text').textContent = `${index + 1}. ${q.q}`;

        const container = document.getElementById('options-container');
        container.innerHTML = '';

        q.options.forEach((optText, optIdx) => {
            const optDiv = document.createElement('div');
            optDiv.className = `option-item ${userAnswers[index] === optIdx ? 'selected' : ''}`;
            optDiv.onclick = () => selectOption(optIdx);

            optDiv.innerHTML = `
                <div class="radio-icon"></div>
                <div>${optText}</div>
            `;
            container.appendChild(optDiv);
        });

        document.getElementById('prev-btn').disabled = index === 0;
        document.getElementById('next-btn').textContent = index === currentQuestions.length - 1 ? 'إنهاء النموذج' : 'التالي';

        showFeedback();
        updateAnsweredCounter();
    }

    function selectOption(optionIndex) {
        userAnswers[currentIndex] = optionIndex;
        loadQuestion(currentIndex);
    }

    function showFeedback() {
        const fbBox = document.getElementById('feedback-box');
        const selected = userAnswers[currentIndex];
        const q = currentQuestions[currentIndex];

        if (selected === null) {
            fbBox.style.display = 'none';
            return;
        }

        fbBox.style.display = 'block';
        const isCorrect = selected === q.correct;

        if (isCorrect) {
            fbBox.className = 'feedback-box correct';
            document.getElementById('feedback-title').textContent = 'Correct!';
        } else {
            fbBox.className = 'feedback-box incorrect';
            document.getElementById('feedback-title').textContent = 'Incorrect.';
        }

        document.getElementById('feedback-why').textContent = `Why: ${q.why}`;
        document.getElementById('feedback-ref').textContent = `Reference: ${q.ref}`;
    }

    function updateAnsweredCounter() {
        const count = userAnswers.filter(a => a !== null).length;
        document.getElementById('answered-counter').textContent = `تمت الإجابة على ${count} من أصل ${currentQuestions.length} سؤالاً`;
    }

    function nextQuestion() {
        if (currentIndex < currentQuestions.length - 1) {
            loadQuestion(currentIndex + 1);
        } else {
            const correctCount = userAnswers.filter((ans, idx) => ans === currentQuestions[idx].correct).length;
            alert(`أحسنت! لقد أنهيت هذا النموذج.\nنتيجة الإجابات الصحيحة: ${correctCount} من أصل ${currentQuestions.length}`);
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            loadQuestion(currentIndex - 1);
        }
    }

    function jumpToQuestion(index) {
        loadQuestion(parseInt(index));
    }

    function resetSection() {
        userAnswers.fill(null);
        loadQuestion(0);
    }

    // Launch immediately on page load
    switchSection('all');
</script>
